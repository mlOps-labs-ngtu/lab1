[alembic]
# Расположение скриптов миграций: ini лежит в migrations/, а версии — в migrations/alembic/
script_location = %(here)s/alembic
# Корень проекта в sys.path (запуск из корня: cwd=корень; из контейнера: WORKDIR=/opt/airflow)
prepend_sys_path = .
path_separator = os
# URL берётся из env TS_DATABASE_URL в migrations/alembic/env.py;
# значение в .ini не используется
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
